# Install once with `just setup`. Runs on every commit; `just hooks` runs it on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: trailing-whitespace
        exclude: ^LICENSE$
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Removes notebook outputs on commit so diffs stay readable and no data leaks into git.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
